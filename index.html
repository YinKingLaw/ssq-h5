<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>双色球摇摇乐（在线版）</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f2f3f5; color:#1f1f1f; }
#app { max-width:540px; margin:0 auto; padding-bottom:66px; min-height:100vh; }
/* 顶部标题（红主题，对应小程序 navigationBar #c0392b） */
.topbar { background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:30; }
.topbar h1 { font-size:17px; margin:0; font-weight:600; }
.topbar .sub { font-size:11px; opacity:.9; margin-top:2px; }
/* 「↻ 同步」按钮默认隐藏：数据由后端定时任务自动同步，页面打开即最新，日常无需手动。
   保留元素与其点击逻辑，应急时可在控制台执行
   document.getElementById('syncBtn').style.display='inline' 临时唤出。 */
#syncBtn { display:none; }
.page { display:none; padding:10px; }
.page.on { display:block; }
/* 卡片 */
.card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.card-title { font-size:15px; font-weight:600; color:#222; }
.muted { font-size:12px; color:#999; }
.row.between { display:flex; justify-content:space-between; align-items:center; }
/* 开奖球 */
.balls { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:8px 0; }
.balls.center { justify-content:center; }
.ball { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; }
.ball.red { background:linear-gradient(135deg,#e74c3c,#c0392b); }
.ball.blue { background:linear-gradient(135deg,#5ab0ff,#2980b9); }
.mini { flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:600; }
.mini.red { background:#e74c3c; } .mini.blue { background:#2980b9; }
/* 底部 tabBar（红主题，对应小程序 tabBar selectedColor #c0392b） */
.tabbar { position:fixed; bottom:0; left:0; right:0; max-width:540px; margin:0 auto; display:flex; background:#fff; border-top:1px solid #eee; box-shadow:0 -1px 4px rgba(0,0,0,.06); z-index:40; }
.tabbar .tab { flex:1; text-align:center; padding:7px 0 5px; font-size:11px; color:#999; }
.tabbar .tab .ic { font-size:20px; display:block; line-height:1.1; }
.tabbar .tab.on { color:#c0392b; font-weight:600; }
/* ============ 摇珠机（玻璃球罐，复刻小程序：米字挡板 + L形出球通道） ============ */
.machine { overflow:hidden; }
.globe-wrap { position:relative; width:300px; height:410px; margin:6px auto 0; }
.globe { position:absolute; left:0; top:0; z-index:3; width:300px; height:300px; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.58) 0%, rgba(206,228,250,.13) 56%, rgba(255,255,255,.30) 100%);
  border:3px solid rgba(120,150,190,.5);
  box-shadow:inset 0 14px 32px rgba(255,255,255,.8), inset 0 -18px 40px rgba(41,128,185,.14), 0 10px 26px rgba(41,128,185,.18); }
.globe-sheen { position:absolute; top:5%; left:9%; width:48%; height:30%; border-radius:50%; background:linear-gradient(150deg, rgba(255,255,255,.8), rgba(255,255,255,0) 74%); transform:rotate(-18deg); pointer-events:none; z-index:9; }
#mixField { position:absolute; left:0; top:0; width:100%; height:100%; z-index:4; }
/* 米字玻璃挡板（单个，居中于罐内，作为搅拌轴；4 叶片 = 8 根辐条） */
.baffle { position:absolute; width:0; height:0; z-index:6; }
.hub { position:absolute; left:-11px; top:-11px; width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.97) 0%, rgba(214,234,255,.82) 70%, rgba(150,180,220,.72) 100%);
  box-shadow:0 1px 4px rgba(41,128,185,.26); }
.blade { position:absolute; border-radius:5px;
  background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(198,222,250,.26) 42%, rgba(146,184,224,.30) 60%, rgba(255,255,255,.44) 100%);
  box-shadow:0 0 5px rgba(255,255,255,.65); }
.baffle-center { left:150px; top:150px; }
.baffle-center .blade { left:-115px; top:-3.25px; width:230px; height:6.5px; }
.blade.b0 { transform:rotate(0deg); } .blade.b45 { transform:rotate(45deg); } .blade.b90 { transform:rotate(90deg); } .blade.b135 { transform:rotate(135deg); }
/* 球体：三层独立周期（公转 orbit + 半径脉动 pulse + 自转 mix-ball），周期互不整除 → 玫瑰线轨迹，各走各的
   参考小程序 shake.wxss，但周期更快、脉动幅度更大（用户要求：转得更快、幅度更大） */
.orb { position:absolute; transform:translate(-50%,-50%); }            /* 出球动画用的滚珠 */
.orb.rolling { width:30px; height:30px; line-height:30px; text-align:center; border-radius:50%; color:#fff; font-weight:bold; font-size:13px;
  background:radial-gradient(circle at 32% 30%, #ff8a7a, #e74c3c 70%); box-shadow:0 2px 5px rgba(231,76,60,.4); }
.orb.rolling.blue { background:radial-gradient(circle at 32% 30%, #5ab0ff, #2980b9 70%); box-shadow:0 2px 5px rgba(41,128,185,.4); }
.orbit { position:absolute; width:0; height:0; z-index:4; }            /* 绕区心公转的支点 */
.arm { position:absolute; left:0; top:0; width:0; height:0; }          /* 把球推到环半径 r 处 */
.pulse { position:absolute; left:0; top:0; width:0; height:0; }        /* 半径脉动（径向进出） */
.mix-ball { position:absolute; left:-15px; top:-15px; width:30px; height:30px; line-height:30px; text-align:center; border-radius:50%; color:#fff; font-weight:bold; font-size:13px;
  background:radial-gradient(circle at 32% 30%, #ff8a7a, #e74c3c 70%); box-shadow:0 2px 5px rgba(231,76,60,.4); }
.mix-ball.blue { background:radial-gradient(circle at 32% 30%, #5ab0ff, #2980b9 70%); box-shadow:0 2px 5px rgba(41,128,185,.4); }
/* 默认不挂 animation（避免低端机白屏），仅搅动时挂名 + running；周期互不整除 → 不粘挡板、各走各的 */
.orbit, .pulse, .mix-ball { animation-timing-function:linear; animation-iteration-count:infinite; animation-play-state:paused; }
.globe.stirring .orbit { animation-name: spinCW; }
.globe.stirring .pulse.pA { animation-name: pulseA; }
.globe.stirring .pulse.pB { animation-name: pulseB; }
.globe.stirring .pulse.pC { animation-name: pulseC; }
.globe.stirring .mix-ball { animation-name: spinCW; }
.globe.stirring .orbit, .globe.stirring .pulse, .globe.stirring .mix-ball { animation-play-state: running; }
@keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulseA { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
@keyframes pulseB { 0%,100% { transform: translateX(0); } 50% { transform: translateX(22px); } }
@keyframes pulseC { 0%,100% { transform: translateX(0); } 50% { transform: translateX(32px); } }
/* L 形出球通道（红/蓝各一条，三层玻璃：外圈/白壁/内腔） */
.chute { position:absolute; left:0; top:0; width:300px; height:400px; z-index:1; }
.seg { position:absolute; display:block; transform-origin:50% 50%; }
.seg.l0 { background:#d7e0ec; }
.seg.l1 { background:#ffffff; }
.seg.l2 { background:linear-gradient(to top, #ffffff 0%, #ffffff 60%, #d8e7f9 100%); }
.weld { position:absolute; z-index:5; width:19.5px; height:34.5px; border-radius:50%;
  background:radial-gradient(ellipse at 38% 32%, rgba(255,255,255,.96) 0%, rgba(226,238,252,.82) 55%, rgba(190,214,244,.6) 100%);
  border:1.5px solid rgba(255,255,255,.9);
  box-shadow:0 0 6px rgba(255,255,255,.85), inset 0 0 6px rgba(255,255,255,.9), 0 1px 3px rgba(41,128,185,.18); }
.weld-red { left:120px; top:297px; transform:translate(-50%,-50%) rotate(100deg); }
.weld-blue { left:196.5px; top:292.6px; transform:translate(-50%,-50%) rotate(78deg); }
/* 出球槽：左红球区（结果从左往右排） / 右蓝球区（结果靠右），球滑到球道尽头后落槽 */
.tray-zones { position:absolute; left:0; right:0; top:346px; height:54px; display:flex; gap:5px; padding:0 4px; z-index:12; }
.tray { position:relative; background:rgba(255,255,255,.55); border:1px dashed #cfd8e3; border-radius:10px; padding:14px 6px 3px; display:flex; flex-wrap:nowrap; align-items:center; gap:3px; overflow:hidden; }
.tray .tz-label { position:absolute; left:6px; top:2px; font-size:10px; color:#8b9bb0; pointer-events:none; }
.tray.red { flex:2.2; justify-content:flex-start; background:rgba(231,76,60,.07); border-color:#f0c4bc; }
.tray.blue { flex:0.9; justify-content:flex-end; background:rgba(41,128,185,.07); border-color:#c2d9ef; }
/* 落球变形：从上方落下 → 轻微放大回弹 → 恢复原始尺寸（参考小程序 ball 组件 ballDrop） */
.tray .mini { animation:ballDrop .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes ballDrop { 0%{transform:translateY(-23px) scale(.6);opacity:.25} 60%{transform:translateY(4px) scale(1.06);opacity:1} 100%{transform:translateY(0) scale(1)} }
/* 滚出的球（绝对定位在 globe-wrap，用 Web Animations 沿球道滚动） */
.orb.rolling { position:absolute; z-index:20; width:30px; height:30px; line-height:30px; text-align:center; border-radius:50%; color:#fff; font-weight:bold; font-size:13px; }
.phase-tip { text-align:center; color:#2980b9; font-size:13px; margin:6px 0; }
.result-label { text-align:center; color:#c0392b; font-size:14px; font-weight:bold; margin:6px 0 4px; display:none; }
.shake-btn { display:block; width:70%; margin:10px auto 4px; border:none; border-radius:24px; padding:12px 0; background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; font-size:15px; font-weight:600; }
.shake-btn:disabled { opacity:.7; }
/* 免责声明 banner */
.disclaimer { font-size:11px; color:#b06; line-height:1.6; background:#fff5f3; border:1px solid #f3d6cf; border-radius:10px; padding:8px 10px; margin:4px 0 10px; }
/* ============ 智能预测 ============ */
.topbtns { display:flex; gap:10px; margin:2px 0 10px; }
.topbtn { flex:1; border:none; border-radius:22px; padding:10px 0; font-size:14px; font-weight:600; color:#fff; }
.topbtn.data { background:linear-gradient(135deg,#3498db,#217dbb); }
.topbtn.ai { background:linear-gradient(135deg,#e74c3c,#c0392b); }
.pred-head { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:2px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.ph-label { font-size:12px; color:#999; }
.ph-issue { font-size:18px; font-weight:700; color:#c0392b; }
.ph-note { font-size:11px; color:#aaa; }
.algo-card .card-hit { margin:4px 0 8px; }
.hitcv { width:100%; height:110px; display:block; }
.algo-card .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.algo-name { font-size:15px; font-weight:600; color:#222; }
.algo-name.ai-name { color:#c0392b; }
.hit-chip { font-size:12px; color:#666; white-space:nowrap; }
.hit-chip b { color:#27ae60; }
.hit-chip .sep { color:#ccc; margin:0 4px; }
.detail-link { display:inline-block; font-size:12px; color:#2980b9; text-align:right; }
/* 首行：左侧预测号码；右侧信息栏绝对定位 → 不再撑高首行，第 2/3 行号码紧贴其上、中间无留白 */
.first-row { position:relative; margin-top:2px; }
.first-row .group:first-child { margin-top:0; }
/* 第一行右侧栏：三行文字，逐行与左侧三行号码球「顶端对齐 + 行高一致」
   左侧每行球 22px、行间距 6px → 行距 28px；右列同样用 22px 行高、28px 行距承载 3 行，
   故右列总高 = 3×22 + 2×6 = 78px，第 n 行文字顶边 = 左侧第 n 行球顶边（逐行水平对齐）。
   字号取自「球高 22px 的可用视觉高度」：中文字号 14px + line-height 22px 正好撑满球高。 */
.row-right { position:absolute; right:0; top:0; height:78px; width:54%;
  display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-end; text-align:right; }
.row-right > .rr-line { display:block; height:22px; line-height:22px; margin-top:6px; white-space:nowrap; }
.row-right > .rr-line:first-child { margin-top:0; }
.row-right .hit-chip { font-size:13px; }
.row-right .hit-chip b { font-size:14px; }
.recent-prize { font-size:13px; color:#e67e22; }
.recent-prize b { font-size:14px; }
.max-prize { font-size:13px; color:#c0392b; }
.max-prize b { font-size:14px; }
.row-right .sep { opacity:.5; margin:0 1px; }
/* 历史明细（全屏子网页：占满整屏，列表可滚动） */
.modal-full { max-width:none; }
#modalDetail { padding:0; align-items:stretch; }
#modalDetail .modal { width:100%; height:100vh; max-height:none; border-radius:0; padding:0; display:flex; flex-direction:column; }
#modalDetail .modal-title { padding:16px 16px 10px; }
#modalDetail .muted { padding:0 16px 8px; }
#modalDetail #detailList { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:0 16px 16px; }
#modalDetail .modal-close { border-radius:0; }
.drow2 { padding:10px 0; border-bottom:1px solid #f2f2f2; }
.dr-top { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
.dr-top .di { color:#333; font-weight:600; } .dr-top .dt { color:#c0392b; font-weight:bold; } .dr-top .dh { color:#2980b9; }
.dr-line { display:flex; gap:8px; align-items:center; margin-top:5px; font-size:12px; }
.dr-line .dl { flex:0 0 32px; color:#999; }
.group { display:flex; gap:5px; flex-wrap:nowrap; white-space:nowrap; margin-top:6px; align-items:center; }
/* 历史明细 */
.hdetail { display:none; } .hdetail.on { display:block; }
.hd-rows { margin-top:8px; padding-top:8px; border-top:1px dashed #eee; }
.drow { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid #f5f5f5; font-size:12px; }
.drow .di { color:#333; flex:0 0 56px; } .drow .dp { flex:1; } .drow .dc { color:#2980b9; flex:1; text-align:right; } .drow .dh { color:#c0392b; font-weight:bold; flex:0 0 44px; text-align:right; }
/* 历史库 */
.hist { max-height:66vh; overflow:auto; -webkit-overflow-scrolling:touch; }
.hrow { border-top:1px solid #f2f2f2; padding:10px 0; } .hrow:first-child { border-top:none; }
.hrow .htop { display:flex; justify-content:space-between; align-items:center; }
.hrow .hminis span { margin-left:4px; }
.hrow .hdetail { margin-top:8px; padding-top:8px; border-top:1px dashed #eee; }
.hm { display:inline-block; font-size:11px; color:#27ae60; background:#f0faf3; border-radius:8px; padding:2px 7px; margin:2px 3px 0 0; }
.hm-row { line-height:1.8; }
/* ============ 弹窗 ============ */
.modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; align-items:center; justify-content:center; padding:24px; }
.modal-mask.on { display:flex; }
.modal { width:100%; max-width:460px; max-height:80vh; overflow:auto; background:#fff; border-radius:16px; padding:18px 16px; }
.modal h3 { font-size:14px; margin:14px 0 8px; color:#333; }
.modal-title { font-size:16px; font-weight:700; color:#c0392b; }
.modal-close { display:block; width:100%; margin-top:14px; border:none; border-radius:20px; padding:10px 0; background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; font-size:14px; font-weight:600; }
.atab { width:100%; border-collapse:collapse; font-size:12px; }
.atab th, .atab td { padding:7px 4px; text-align:center; border-bottom:1px solid #f4f4f4; } .atab th { color:#999; font-weight:500; } .atab td.nm { text-align:left; color:#333; }
canvas { width:100%; display:block; }
.ai-group { margin-bottom:12px; }
.loading { text-align:center; color:#aaa; font-size:13px; padding:24px 0; }
.saved { font-size:11px; color:#888; line-height:1.7; padding:6px 12px 14px; }
.saved b { color:#c0392b; }

</style>
</head>
<body>
<div id="app">
<div class="topbar"><h1>🎯 双色球摇摇乐</h1><div class="sub">在线版 · 个人学习参考 · 非购彩建议 &nbsp;<span class="syncbtn" id="syncBtn">↻ 同步</span></div></div>
<div class="saved" id="saved" style="display:none"></div>

<!-- 摇摇乐 -->
<section class="page on" id="page-shake">
  <div class="card latest-bar">
    <div class="row between"><text class="card-title">最近一期开奖</text><text class="muted" id="latestDate"></text></div>
    <div class="muted" id="latestIssue"></div>
    <div class="balls" id="latestBalls"></div>
    <div class="muted" id="latestMeta"></div>
  </div>
  <div class="card machine">
    <div class="card-title">摇珠机</div>
    <div class="globe-wrap">
      <div class="globe" id="globe">
        <!-- 米字玻璃挡板（单个居中，4 叶片 = 8 辐条，作为搅拌轴） -->
        <div class="baffle baffle-center"><div class="hub"></div><div class="blade b0"></div><div class="blade b45"></div><div class="blade b90"></div><div class="blade b135"></div></div>
        <div class="balls-field" id="mixField"></div>
        <div class="globe-sheen"></div>
      </div>
      <!-- L 形出球通道（由 JS 从 rpx 数据缩放生成；红道出口偏左、蓝道出口偏右） -->
      <div class="chute" id="chuteLayer"></div>
      <div class="weld weld-red"></div>
      <div class="weld weld-blue"></div>
      <div class="tray-zones"><div class="tray red" id="trayRed"><span class="tz-label">红球区</span></div><div class="tray blue" id="trayBlue"><span class="tz-label">蓝球区</span></div></div>
    </div>
    <div class="result-label" id="resultLabel">本次随机推荐（仅展示，不保存）</div>
    <button class="shake-btn" id="shakeBtn">⚡ 摇一摇</button>
  </div>
  <div class="disclaimer">本工具仅用于个人娱乐，所有号码为本地随机生成，与开奖无关，不构成任何购彩、投注建议。请理性购彩、量力而行。</div>
</section>

<!-- 历史库 -->
<section class="page" id="page-history">
  <div class="card"><div class="row between"><text class="card-title">历史开奖</text><text class="muted" id="histCount"></text></div><div class="hist" id="histList"></div></div>
</section>

<!-- 智能预测 -->
<section class="page" id="page-predict">
  <div class="topbtns"><button class="topbtn data" id="btnData">📊 数据分析</button><button class="topbtn ai" id="btnAi">💡 AI 建议</button></div>
  <div class="pred-head" id="predHead"></div>
  <div id="predList"></div>
  <div class="disclaimer">预测由本地算法对历史开奖统计得出，仅为个人学习参考，不构成任何购彩建议。双色球随机开奖，任何预测均无法保证中奖。</div>
</section>

<nav class="tabbar">
  <div class="tab on" data-p="shake"><span class="ic">🎰</span>摇摇乐</div>
  <div class="tab" data-p="history"><span class="ic">📜</span>历史库</div>
  <div class="tab" data-p="predict"><span class="ic">📊</span>智能预测</div>
</nav>

<!-- 数据分析弹窗 -->
<div class="modal-mask" id="modalMask"><div class="modal" id="modalAnalysis">
  <div class="modal-title">数据分析 · 各算法命中率</div>
  <div id="analysisBody"></div>
  <button class="modal-close" onclick="closeModal()">关闭</button>
</div></div>
<!-- AI 建议弹窗 -->
<div class="modal-mask" id="modalMask2"><div class="modal" id="modalAi">
  <div class="modal-title">AI 建议 · 综合推荐</div>
  <div id="aiBody"></div>
  <button class="modal-close" onclick="closeModal()">关闭</button>
</div></div>
<!-- 历史模拟明细（全屏子网页） -->
<div class="modal-mask" id="modalDetail"><div class="modal modal-full" id="modalDetailBody">
  <div class="modal-title" id="detailTitle"></div>

const $ = s => document.querySelector(s)
const apiBase = () => {
  const p = new URLSearchParams(location.search).get('api')
  if (p) return p.replace(/\/$/, '')
  return (window.SSQ_API_BASE || '').replace(/\/$/, '')
}
const CACHE_KEY = 'ssq_h5_v1'

async function getJson(path) {
  const base = apiBase()
  const url = base ? base + path : path
  const r = await fetch(url, { headers: { 'Accept': 'application/json' } })
  if (!r.ok) throw new Error('HTTP ' + r.status)
  return r.json()
}
function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)) } catch (e) { return null } }
function saveCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), ...d })) } catch (e) {} }

  const url = base ? base + '/api/sync' : '/api/sync'
  const r = await fetch(url, { method: 'POST' })
  if (!r.ok) throw new Error('HTTP ' + r.status)
  return r.json()
}
async function refresh(force) {

    const [results, predictions, gauge] = await Promise.all([

/* 玻璃罐内 33 红 + 16 蓝：混在同一个以罐心(150,150)为中心的圆形区域里转动（红蓝交错散布）
   每球三层独立时间线（周期互不整除，也不等于挡板周期）：
     orbit 公转 1.3~2.1s  /  pulse 半径脉动 1.0~1.7s（幅度 14/22/32px）/  mix-ball 自转 2.5~4.5s
   公转 + 脉动合成不重复的玫瑰线轨迹 -> 球各走各的；挡板作为搅拌轴不粘球。
   起始相位用负 animation-delay 实现（等价于动画从相位处开始）。 */
function buildGlobe(){ var field = $('#mixField');
  var CX = 150, CY = 150, RINGS = [22,38,52,64,74];
  var PULSE = ['pA','pB','pC'];
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var seqN = function(n){ return Array.from({length:n}, function(_,i){ return String(i+1).padStart(2,'0'); }); };
  var balls = shuffle(seqN(33).map(function(n){ return {c:'red', n:n}; }).concat(seqN(16).map(function(n){ return {c:'blue', n:n}; })));
  var slots = [];
  var sum = RINGS.reduce(function(a,b){ return a+b; }, 0);
  var counts = RINGS.map(function(r){ return Math.max(1, Math.round(balls.length*r/sum)); });
  var diff = balls.length - counts.reduce(function(a,b){ return a+b; }, 0);
  while(diff !== 0){ if(diff>0){ var mi=0; for(var k=1;k<counts.length;k++){ if(counts[k]<counts[mi]) mi=k; } counts[mi]++; diff--; }
    else { var mx=0; for(var k=1;k<counts.length;k++){ if(counts[k]>counts[mx]) mx=k; } counts[mx]--; diff++; } }
  RINGS.forEach(function(ring, ri){ var c = counts[ri];
    for(var kk=0; kk<c; kk++){ var ang = (kk/c)*Math.PI*2 + (Math.random()-0.5)*0.5; slots.push({ ring:ring, ang:ang }); }
  });
  shuffle(slots);
  var h = '';
  balls.forEach(function(b, idx){
    var s = slots[idx];
    var phase = ((s.ang/(Math.PI*2))%1+1)%1;
    var tOrbit = rnd(1.3,2.1), dOrbit = -(phase*tOrbit);
    var tPulse = rnd(1.0,1.7), dPulse = -Math.random()*tPulse;
    var pcls = PULSE[Math.floor(Math.random()*3)];
    var tSpin = rnd(2.5,4.5), dSpin = -Math.random()*tSpin;
    var r = s.ring + (Math.random()-0.5)*5;
    h += '<div class="orbit" style="left:'+CX+'px;top:'+CY+'px;transform:rotate('+(s.ang*180/Math.PI).toFixed(1)+'deg);animation-duration:'+tOrbit.toFixed(2)+'s;animation-delay:'+dOrbit.toFixed(2)+'s;">'
      + '<div class="arm" style="transform:translateX('+r.toFixed(1)+'px)">'
      + '<div class="pulse '+pcls+'" style="animation-duration:'+tPulse.toFixed(2)+'s;animation-delay:'+dPulse.toFixed(2)+'s;">'
      + '<div class="mix-ball '+b.c+'" style="animation-duration:'+tSpin.toFixed(2)+'s;animation-delay:'+dSpin.toFixed(2)+'s;">'+b.n+'</div>'
      + '</div></div></div>';
  });
  field.innerHTML = h;
}
/* 生成 L 形出球通道（三层玻璃分段 + 焊环，缩放到 px） */
function buildChute(){ var S=0.75, h='';
  function emit(arr){ arr.forEach(function(p){ var left=p[0]*S, top=p[1]*S, w=p[2]*S, ht=p[3]*S, rot=p[5];
    var br = (p[4]===50)?'50%':(p[4]*S).toFixed(2)+'px';
    h += '<div class="seg '+p[6]+'" style="left:'+left.toFixed(2)+'px;top:'+top.toFixed(2)+'px;width:'+w.toFixed(2)+'px;height:'+ht.toFixed(2)+'px;border-radius:'+br+';transform:rotate('+rot+'deg)"></div>'; }); }
  emit(CHUTE_R); emit(CHUTE_B);
  $('#chuteLayer').innerHTML = h;
}

function rollBall(ball){ return new Promise(function(resolve){
  var wrap = $('.globe-wrap'); var orb = document.createElement('div');
  orb.className = 'orb rolling ' + (ball.c==='blue' ? 'blue' : 'red'); orb.textContent = ball.n;
  orb.style.left = '0px'; orb.style.top = '0px'; wrap.appendChild(orb);
  // 沿球道滑落（参考小程序 shake.wxss 的 slideRed / slideBlue 关键帧）：
  //   起点 = 罐底【偏移的竖管口】（红道口偏左 / 蓝道口偏右），而不是罐心正中
  //   竖段下滑 → R18 圆弧拐弯 → 横段滑出，一路贴球道到尽头再落入托盘，不会在中段突降
  //   坐标 = 小程序 rpx × 0.75；首段用加速缓动模拟罐内自由落体
  var isBlue = ball.c==='blue';
  var RED  = [[119.22,301.43],[115.31,323.59,0.206],[112.88,330.95,0.277],[108.47,337.31,0.349],[102.43,342.17,0.420],[95.25,345.10,0.491],[41.40,358.52]];
  var BLUE = [[197.44,296.98],[203.36,324.86,0.248],[206.04,332.12,0.315],[210.68,338.33,0.383],[216.89,342.97,0.450],[224.16,345.65,0.518],[278.45,357.19]];
  var pts = isBlue ? BLUE : RED; var last = pts.length - 1;
  var kf = pts.map(function(p, i){
    var o = { transform:'translate(-50%,-50%) translate('+p[0]+'px,'+p[1]+'px) rotate('+(i*64)+'deg)' };
    if(i>0 && i<last) o.offset = p[2];
    if(i===0) o.easing = 'cubic-bezier(.42,0,1,1)';
    return o;
  });
  var anim = orb.animate(kf, { duration:1800, easing:'linear', fill:'forwards' });
  anim.onfinish = function(){
    var tray = isBlue ? $('#trayBlue') : $('#trayRed');
    var span = document.createElement('span'); span.className = 'mini ' + (isBlue?'blue':'red'); span.textContent = ball.n;
    tray.appendChild(span); orb.remove(); resolve();
  };
}); }
$('#shakeBtn').onclick = async function(){ if(shaking) return; shaking = true; var b = $('#shakeBtn'); b.textContent='摇奖中…'; b.disabled=true;
  var g = $('#globe'); g.classList.add('stirring');   // 进入即搅动（首次进入也处于搅动状态）
  var reds=[]; while(reds.length<6){ var x=String(Math.floor(Math.random()*33)+1).padStart(2,'0'); if(reds.indexOf(x)<0) reds.push(x); } reds.sort();
  var blue = String(Math.floor(Math.random()*16)+1).padStart(2,'0');
  var seq = reds.map(function(r){ return {c:'red', n:r}; }); seq.push({c:'blue', n:blue});
  $('#trayRed').innerHTML = '<span class="tz-label">红球区</span>'; $('#trayBlue').innerHTML = '<span class="tz-label">蓝球区</span>';
  $('#resultLabel').style.display = 'none';
  for(var i=0;i<seq.length;i++){
    await sleep(1200);                  // 先搅动约 1.2 秒
    g.classList.remove('stirring');     // 出球前停止搅动
    await rollBall(seq[i]);             // 球从球道滚出（约 1.2s），期间罐内静止
    if(i < seq.length-1) g.classList.add('stirring');  // 非最后一颗则继续搅动
  }
  // 出完蓝球后保持静止（不再重新搅动）
  $('#resultLabel').style.display = 'block';
  b.textContent='⚡ 摇一摇'; b.disabled=false; shaking=false;
};

/* 智能预测 */
function firstGroupOf(r, k){ if(k==='ai'){ return (r.ai&&r.ai.groups&&r.ai.groups[0])||null; } return (r.preds[k]&&r.preds[k].groups[0])||null; }
function renderPredict(){ var p = DATA.predictions; var next = p.next; var avg = (DATA.gauge&&DATA.gauge.avg)||{};
  if(!next){ $('#predList').innerHTML='<div class="loading">暂无预测</div>'; return; }
  $('#predHead').innerHTML = '<text class="ph-label">当前预测期号</text><text class="ph-issue">第 '+next.issue+' 期</text><text class="ph-note">（待开奖 · 已封存锁定，结果不会变化）</text>';
  var recs = (p.records||[]).filter(function(r){ return r.hasActual; });
  var tail = recs.slice(-10);
  var hitLabels = tail.map(function(r){ return String(r.issue).slice(2); });
  var predsMap = {}; Object.keys(next.preds).forEach(function(k){ predsMap[k] = next.preds[k]; });
  if(next.ai) predsMap.ai = { groups: next.ai.groups };
  /* 每种算法：最近一次中奖（奖金>0）的期号/奖级，以及历史最高中奖金额 */
  var recentPrize = {}; var maxPrize = {}; var keys = Object.keys(predsMap);
  recs.slice().reverse().forEach(function(r){
    keys.forEach(function(k){
      var g = firstGroupOf(r, k); if(!g || !r.actual) return;
      var pr = prizeOf(g.red, g.blue, r.actual.red, r.actual.blue, r);
      if(pr.money>0){
        if(!recentPrize[k]) recentPrize[k] = { issue:r.issue, t:pr.t, money:pr.money };
        if(!maxPrize[k] || pr.money > maxPrize[k].money) maxPrize[k] = { issue:r.issue, t:pr.t, money:pr.money };
      }
    });
  });
  var h = '';
  Object.keys(predsMap).forEach(function(key){ var pr = predsMap[key]; var isAi = (key==='ai');
    var hist = avg[key] ? avg[key].composite.toFixed(1)+'%' : '-';
    var recent = (avg[key]&&avg[key].near10Composite) ? avg[key].near10Composite.toFixed(1)+'%' : '-';
    var series = tail.map(function(r){ return r.hits[key] ? +r.hits[key].composite.toFixed(1) : 0; });
    var rp = recentPrize[key];
    var rpText = rp ? ('最近中奖 <b>'+rp.issue+'</b>期 <b>'+rp.t+'</b>') : '最近中奖 暂无';
    var mp = maxPrize[key];
    var mpText = mp ? ('历史中奖 <b>'+mp.issue+'</b>期 <b>'+mp.t+'</b>') : '历史中奖 暂无';
    var groupsHtml = (pr.groups||[]).map(function(g, idx){
      if(idx===0) return '<div class="first-row"><div class="group">'+minis(g.red,g.blue)+'</div>'
        + '<div class="row-right">'
        + '<span class="rr-line hit-chip">近10期 <b>'+recent+'</b><span class="sep">·</span>历史 <b>'+hist+'</b></span>'
        + '<span class="rr-line recent-prize">'+rpText+'</span>'
        + '<span class="rr-line max-prize">'+mpText+'</span></div></div>';
      return '<div class="group">'+minis(g.red,g.blue)+'</div>';
    }).join('');
    h += '<div class="card algo-card" data-key="'+key+'">'
      + '<div class="card-head"><span class="algo-name '+(isAi?'ai-name':'')+'">'+(isAi?'🤖 ':'')+(ALGO_NAMES[key]||key)+'</span>'
      + '<span class="detail-link" data-key="'+key+'">历史预测明细 ›</span></div>'
      + '<div class="card-hit"><canvas class="hitcv" data-labels="'+hitLabels.join(',')+'" data-series="'+series.join(',')+'"></canvas></div>'
      + '<div class="card-body">'+groupsHtml+'</div>'
      + '</div>';
  });
  $('#predList').innerHTML = h;
  document.querySelectorAll('#predList .hitcv').forEach(function(cv){ drawHitCv(cv); });
}
/* 派彩：模拟单式一注 vs 真实开奖，按双色球规则定奖级与奖金（浮动奖取当期单注奖金） */
function prizeOf(simRed, simBlue, actRed, actBlue, iss){
  var rs = simRed.filter(function(x){ return actRed.indexOf(x)>=0; }).length;
  var bs = (simBlue===actBlue) ? 1 : 0;
  if(rs===6 && bs===1) return { t:'一等奖', money:iss.firstPrize };
  if(rs===6) return { t:'二等奖', money:iss.secondPrize };
  if(rs===5 && bs===1) return { t:'三等奖', money:3000 };
  if(rs===5 || (rs===4 && bs===1)) return { t:'四等奖', money:200 };
  if(rs===4 || (rs===3 && bs===1)) return { t:'五等奖', money:10 };
  if(bs===1) return { t:'六等奖', money:5 };
  return { t:'未中奖', money:0 };
}
/* 历史模拟明细：全屏子网页，模拟号码 + 真实开奖 + 命中率 + 派彩奖金 */
function openDetail(key){ var p = DATA.predictions;
  var recs = (p.records||[]).filter(function(r){ return r.hasActual; });
  var list = recs.slice(-200).reverse();
  var html = '';
  list.forEach(function(r){
    var g = firstGroupOf(r, key);
    var comp = (r.hits[key]&&r.hits[key].composite!=null) ? r.hits[key].composite.toFixed(1)+'%' : '-';
    var pred = g ? minis(g.red,g.blue) : '—';
    var act = r.actual ? balls(r.actual.red,r.actual.blue) : '—';
    var pr = (g&&r.actual) ? prizeOf(g.red, g.blue, r.actual.red, r.actual.blue, r) : { t:'未中奖', money:0 };
    var money = pr.money ? '¥' + pr.money.toLocaleString('zh-CN') : '¥0';
    html += '<div class="drow2"><div class="dr-top"><span class="di">'+r.issue+' 期</span><span class="dt">'+pr.t+' · '+money+'</span><span class="dh">'+comp+'</span></div>'
      + '<div class="dr-line"><span class="dl">模拟</span>'+pred+'</div>'
      + '<div class="dr-line"><span class="dl">开奖</span>'+act+'</div></div>';
  });
  $('#detailTitle').textContent = '历史预测明细 · ' + (ALGO_NAMES[key]||key);
  var sub = document.getElementById('detailSub');
  if(sub) sub.textContent = '共 ' + recs.length + ' 期已开奖记录（由近及远）· 当前显示 ' + list.length + ' 期';
  $('#detailList').innerHTML = html || '<div class="loading">暂无</div>';
  showModal('modalDetail');
}
/* 绘制单条近10期命中率折线图（带数据标签，小数点保留 1 位，保留百分比符号） */
function drawHitCv(cv){ var series = cv.dataset.series.split(',').map(Number); var W = cv.clientWidth||300, H = 120;
  cv.width = W*2; cv.height = H*2; cv.style.height = H+'px'; var ctx = cv.getContext('2d'); if(!ctx) return; ctx.scale(2,2);
  var n=series.length; if(n<2) return;
  var top=20, base=H-8;
  function py(v){ return base - (v/100)*(base-top); }
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2; ctx.beginPath();
  series.forEach(function(v,i){ var x=W*i/(n-1), y=py(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ctx.fillStyle='#c0392b'; series.forEach(function(v,i){ var x=W*i/(n-1), y=py(v); ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fill(); });
  ctx.font='9px -apple-system,"PingFang SC",sans-serif'; ctx.textBaseline='bottom'; ctx.fillStyle='#c0392b';
  series.forEach(function(v,i){ var x=W*i/(n-1), y=py(v);
    ctx.textAlign = (i===0) ? 'left' : (i===n-1 ? 'right' : 'center');
    ctx.fillText(v.toFixed(1)+'%', x, y-4);
  });
}
/* 数据分析弹窗：各算法命中率表 + AI 综合命中率趋势 */
function openAnalysis(){ var avg = (DATA.gauge&&DATA.gauge.avg)||{};
  var t = '<table class="atab"><thead><tr><th>算法</th><th>历史平均</th><th>近10期</th></tr></thead><tbody>';
  Object.keys(avg).forEach(function(k){ t += '<tr><td class="nm">'+(ALGO_NAMES[k]||k)+'</td><td>'+avg[k].composite.toFixed(1)+'%</td><td>'+(avg[k].near10Composite?avg[k].near10Composite.toFixed(1):'-')+'%</td></tr>'; });
  t += '</tbody></table>';
  $('#analysisBody').innerHTML = t + '<canvas id="gaugeCv"></canvas>';
  showModal('modalAnalysis'); renderGauge();
}
/* AI 建议弹窗：综合推荐号码（与数据分析弹窗内容互相独立） */
function openAi(){ var ai = (DATA.predictions.next.ai&&DATA.predictions.next.ai.groups)||[]; var h='';
  ai.forEach(function(g){ h += '<div class="ai-group"><div class="balls center">'+balls(g.red,g.blue)+'</div></div>'; });
  $('#aiBody').innerHTML = h || '<div class="loading">暂无</div>'; showModal('modalAi');
}
/* 关键修复：弹窗要找自身所在的遮罩层，否则 AI 建议会误显示数据分析弹窗 */
function showModal(id){ var m = document.getElementById(id); if(!m) return; m.classList.add('on'); var mask = m.closest('.modal-mask'); if(mask) mask.classList.add('on'); }
function closeModal(){ document.querySelectorAll('.modal-mask').forEach(function(m){ m.classList.remove('on'); }); }
function renderGauge(){ var g = DATA.gauge; if(!g||!g.timeline||!g.timeline.length) return; var cv = document.getElementById('gaugeCv'); if(!cv) return;
  var ctx = cv.getContext('2d'); if(!ctx) return;
  var W = cv.width = cv.clientWidth*2, H = cv.height = 320; var s = g.timeline.map(function(t){return t.composite.ai;}); var n = s.length;
  ctx.strokeStyle='#eee'; ctx.lineWidth=1; for(var i=0;i<=4;i++){ var y=H*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=3; ctx.beginPath(); s.forEach(function(v,i){ var x=W*i/(n-1), y=H-v/100*H; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ctx.fillStyle='#c0392b'; s.forEach(function(v,i){ var x=W*i/(n-1), y=H-v/100*H; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); });
}

/* 历史库 */
function renderHistory(){ var list = DATA.results||[]; $('#histCount').textContent = list.length + ' 期';
  if(!list.length){ $('#histList').innerHTML='<div class="loading">暂无</div>'; return; }
  var recs = (DATA.predictions&&DATA.predictions.records)||[]; var rm={}; recs.forEach(function(r){ if(r.hasActual) rm[r.issue]=r; });
  var h=''; list.forEach(function(r){ var rec = rm[r.issue]; var detail='';
    if(rec){ detail='<div class="hdetail" id="hd-'+r.issue+'"><div class="hm-row">'; Object.keys(rec.hits).forEach(function(k){ detail += '<span class="hm">'+(ALGO_NAMES[k]||k)+' '+rec.hits[k].composite.toFixed(1)+'%</span>'; }); detail+='</div></div>'; }
    h += '<div class="hrow" data-issue="'+r.issue+'"><div class="htop"><span>'+r.issue+' 期 · '+r.date+'</span><span class="hminis">'+minis(r.red,r.blue)+'</span></div>'+detail+'</div>';
  });
  $('#histList').innerHTML = h;
}
window.toggleHd = function(id){ var d = document.getElementById('hd-'+id); if(d) d.classList.toggle('on'); };
/* 历史库点击行展开命中率 */
document.getElementById('histList').addEventListener('click', function(e){ var row = e.target.closest('.hrow'); if(row) window.toggleHd(row.dataset.issue); });
/* 历史明细点击（智能预测页）→ 全屏子网页 */
document.getElementById('predList').addEventListener('click', function(e){ var l = e.target.closest('.detail-link'); if(l) openDetail(l.dataset.key); });

/* tab 切换 */
document.querySelectorAll('.tabbar .tab').forEach(function(t){ t.onclick = function(){ document.querySelectorAll('.tabbar .tab').forEach(function(x){x.classList.remove('on');}); document.querySelectorAll('.page').forEach(function(x){x.classList.remove('on');}); t.classList.add('on'); document.getElementById('page-'+t.dataset.p).classList.add('on'); }; });
$('#btnData').onclick = openAnalysis;
$('#btnAi').onclick = openAi;
document.querySelectorAll('.modal-mask').forEach(function(m){ m.addEventListener('click', function(e){ if(e.target===m) closeModal(); }); });

/* 在线同步按钮：默认隐藏（后端有 GitHub Actions 定时同步，日常无需手动）。
   隐藏方式用 CSS（display:none）而非移除元素 —— 这样按钮与事件仍保留，
   需要应急手动同步时，浏览器控制台执行 document.getElementById('syncBtn').style.display='inline' 即可唤出。 */
$('#syncBtn').onclick = function(){ var b=$('#syncBtn'); b.textContent='同步中…'; b.disabled=true;
  doSync().then(function(){ return refresh(true); }).catch(function(e){ showSaved('⚠️ 同步失败：'+e.message); }).finally(function(){ b.textContent='↻ 同步'; b.disabled=false; });
};

refresh(false);

</script>
